services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio-storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  polaris:
    image: apache/polaris:latest
    container_name: polaris-catalog
    ports:
      - "8181:8181"
    environment:
      - POLARIS_BOOTSTRAP_DEFAULT_REALM=default-realm
    depends_on:
      - minio



  mysql:
    image: mysql:8.0
    container_name: mysql-db
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: icepol_metrics
      MYSQL_USER: icepol
      MYSQL_PASSWORD: password123
    volumes:
      - mysql-data:/var/lib/mysql

  postgres-langfuse:
    image: postgres:15-alpine
    container_name: postgres-langfuse
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: langfuse
    volumes:
      - postgres-langfuse-data:/var/lib/postgresql/data

  langfuse:
    image: langfuse/langfuse:2
    container_name: langfuse-server
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:password123@postgres-langfuse:5432/langfuse
      - NEXTAUTH_URL=http://localhost:3001
      - NEXTAUTH_SECRET=icepol-langfuse-secret-key-12345
      - SALT=icepol-langfuse-salt-key-12345
      - TELEMETRY_ENABLED=false
      - LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES=true
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=admin
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=password123
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
    depends_on:
      - postgres-langfuse
      - minio

  semantic-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semantic-agent
    ports:
      - "8000:8000"
    environment:
      - LLAMA_SERVER_URL=http://host.containers.internal:11434
      - LLM_MODEL=llama3.2:3b
      - MINIO_ENDPOINT=minio-storage:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password123
      - MYSQL_HOST=mysql-db
      - MYSQL_PORT=3306
      - MYSQL_USER=icepol
      - MYSQL_PASSWORD=password123
      - MYSQL_DB=icepol_metrics
      - LANGFUSE_HOST=http://langfuse:3000
      - LANGFUSE_PUBLIC_KEY=pk-lf-icepol
      - LANGFUSE_SECRET_KEY=sk-lf-icepol
    depends_on:
      - minio
      - polaris
      - mysql

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-server
    command: ["python", "-m", "core.mcp_server"]
    environment:
      - LLAMA_SERVER_URL=http://host.containers.internal:11434
      - LLM_MODEL=llama3.2:3b
      - MINIO_ENDPOINT=minio-storage:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password123
    depends_on:
      - minio
      - polaris

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://semantic-agent:8000/v1
      - OPENAI_API_KEY=local
    depends_on:
      - semantic-agent

volumes:
  minio-data:
  mysql-data:
  postgres-langfuse-data:
