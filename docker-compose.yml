services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio-storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  polaris:
    image: apache/polaris:latest
    container_name: polaris-catalog
    ports:
      - "8181:8181"
    environment:
      - POLARIS_BOOTSTRAP_DEFAULT_REALM=default-realm
    depends_on:
      - minio



  semantic-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semantic-agent
    ports:
      - "8000:8000"
    environment:
      - LLAMA_SERVER_URL=http://host.containers.internal:11434
      - LLM_MODEL=llama3.2:3b
      - MINIO_ENDPOINT=minio-storage:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password123
    depends_on:
      - minio
      - polaris

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-server
    command: ["python", "-m", "core.mcp_server"]
    environment:
      - LLAMA_SERVER_URL=http://host.containers.internal:11434
      - LLM_MODEL=llama3.2:3b
      - MINIO_ENDPOINT=minio-storage:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password123
    depends_on:
      - minio
      - polaris

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://semantic-agent:8000/v1
      - OPENAI_API_KEY=local
    depends_on:
      - semantic-agent

volumes:
  minio-data:
